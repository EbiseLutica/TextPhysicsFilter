name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Unofficial mirror of the AviUtl2 plugin SDK, pinned to a commit.
  SDK_REPOSITORY: aviutl2/aviutl2_sdk_mirror
  SDK_REF: 7d2af438c32b4cea66c6a30e69b9dab9229c2032

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPOSITORY }}
          ref: ${{ env.SDK_REF }}
          path: aviutl2_sdk

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DAVIUTL2_SDK_DIR="${{ github.workspace }}/aviutl2_sdk/include/aviutl2_sdk"

      - name: Build
        run: cmake --build build --config Release

      - name: Check output
        shell: bash
        run: |
          ls -l build/Release
          test -f build/Release/TextPhysicsFilter.auf2

      - uses: actions/upload-artifact@v4
        with:
          name: TextPhysicsFilter-${{ github.sha }}
          path: build/Release/TextPhysicsFilter.auf2
          if-no-files-found: error

      # Rolling pre-release per branch so the latest build has a fixed download URL:
      #   https://github.com/<owner>/<repo>/releases/download/dev-<branch>/TextPhysicsFilter.auf2
      - name: Publish dev release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" build/Release/TextPhysicsFilter.auf2 \
            --target "$GITHUB_SHA" --prerelease \
            --title "dev build ($GITHUB_REF_NAME)" \
            --notes "Automated build of $GITHUB_SHA"

  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPOSITORY }}
          ref: ${{ env.SDK_REF }}
          path: aviutl2_sdk

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTEXTPHYSICS_HOST_TEST=ON
          -DAVIUTL2_SDK_DIR="${{ github.workspace }}/aviutl2_sdk/include/aviutl2_sdk"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
